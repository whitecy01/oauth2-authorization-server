<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Token Request</title>
</head>
<body>
<h1>OAuth 2.0 Token Request</h1>

<form method="post" action="/oauth2/token">
    <div>
        <label for="grant_type">grant_type</label>
        <input id="grant_type" name="grant_type" type="text" value="authorization_code" readonly>
    </div>
    <div>
        <label for="client_id">client_id</label>
        <input id="client_id" name="client_id" type="text" value="test-client">
    </div>
    <div>
        <label for="client_secret">client_secret</label>
        <input id="client_secret" name="client_secret" type="text" value="secret">
    </div>
    <div>
        <label for="code">code</label>
        <input id="code" name="code" type="text" th:value="${code}">
    </div>
    <div>
        <label for="redirect_uri">redirect_uri</label>
        <input id="redirect_uri" name="redirect_uri" type="text" th:value="${redirectUri}">
    </div>
    <button type="submit">Request Token</button>
</form>
</body>
</html>
