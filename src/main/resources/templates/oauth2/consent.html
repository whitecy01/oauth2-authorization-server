<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consent</title>
    <style>
        :root {
            --bg: #f3ede4;
            --panel: rgba(255, 251, 245, 0.95);
            --line: #dbcbb9;
            --text: #201915;
            --muted: #6a5d53;
            --approve: #205c43;
            --approve-strong: #184633;
            --deny: #efe2d7;
            --deny-text: #8a3326;
            --chip: #f1e4d5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(255, 246, 233, 0.9), transparent 30%),
                linear-gradient(180deg, #f7f1e9 0%, #ebdfd1 100%);
        }

        .card {
            width: min(720px, 100%);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 24px 60px rgba(74, 46, 24, 0.12);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            line-height: 1.05;
        }

        .lead {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 1rem;
        }

        .panel {
            margin-bottom: 18px;
            padding: 18px;
            border-radius: 18px;
            background: #fffdf9;
            border: 1px solid #eadbc8;
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 1rem;
        }

        .meta {
            display: grid;
            gap: 10px;
        }

        .meta-row strong {
            display: block;
            margin-bottom: 4px;
            font-size: 0.92rem;
        }

        .meta-row span {
            color: var(--muted);
            word-break: break-all;
        }

        .scope-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .scope-chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-weight: 700;
            font-size: 0.92rem;
        }

        .empty {
            margin: 0;
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .approve {
            background: var(--approve);
            color: #f6fff8;
        }

        .approve:hover {
            background: var(--approve-strong);
        }

        .deny {
            background: var(--deny);
            color: var(--deny-text);
        }

        .deny:hover {
            background: #e7d2c4;
        }
    </style>
</head>
<body>
<main class="card">
    <p class="eyebrow">Authorization Consent</p>
    <h1 th:text="|${client.clientName} access request|">Client access request</h1>
    <p class="lead" th:text="|${username} 계정으로 ${client.clientName} 클라이언트에 권한을 부여할지 선택하세요.|">
        Decide whether to approve this client.
    </p>

    <section class="panel">
        <h2>Client Information</h2>
        <div class="meta">
            <div class="meta-row">
                <strong>clientId</strong>
                <span th:text="${client.clientId}">test-client</span>
            </div>
            <div class="meta-row">
                <strong>redirectUri</strong>
                <span th:text="${redirectUri}">http://localhost:8080/callback</span>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2>Requested Scopes</h2>
        <p class="empty" th:if="${#lists.isEmpty(requestedScopes)}">요청된 scope가 없습니다.</p>
        <div class="scope-list" th:if="${!#lists.isEmpty(requestedScopes)}">
            <span class="scope-chip" th:each="requestedScope : ${requestedScopes}" th:text="${requestedScope}">read</span>
        </div>
    </section>

    <form th:action="@{/oauth2/authorize}" method="post">
        <input type="hidden" name="response_type" th:value="${responseType}" />
        <input type="hidden" name="client_id" th:value="${clientId}" />
        <input type="hidden" name="redirect_uri" th:value="${redirectUri}" />
        <input type="hidden" name="scope" th:value="${scope}" />
        <input type="hidden" name="state" th:value="${state}" />

        <div class="actions">
            <button class="approve" type="submit" name="action" value="approve">Approve</button>
            <button class="deny" type="submit" name="action" value="deny">Deny</button>
        </div>
    </form>
</main>
</body>
</html>
